services:
  web:
    build: .
    image: gapit-timestatistikk
    container_name: gapit-timestatistikk
    ports:
      - "3000:3000"
    # Miljøvariabler (Tripletex-tokens, admin-passord).
    # Kopier .env.example -> .env.local og fyll inn før første start.
    env_file:
      - .env.local
    # Varig lager for data/groups.json – overlever down/up og nye bygg.
    volumes:
      - gapit-data:/app/data
    restart: unless-stopped

volumes:
  gapit-data:
