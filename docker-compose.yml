services:
  web:
    build: .
    image: gapit-timestatistikk
    container_name: gapit-timestatistikk
    ports:
      - "3000:3000"
    # Miljøvariabler (Tripletex-tokens, admin-passord).
    # Kopier .env.example -> .env.local og fyll inn før første start.
    env_file:
      - .env.local
    # Varig lager for data/groups.json – overlever down/up og nye bygg.
    volumes:
      - gapit-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/admin',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  gapit-data:
